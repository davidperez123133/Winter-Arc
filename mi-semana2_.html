<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WINTER ARC</title>
<style>
  :root {
    --bg: #0A0F16;
    --surface: #121B26;
    --surface-2: #1A2530;
    --line: #29394A;
    --text: #EAF3FB;
    --text-dim: #9BB3C8;
    --text-mute: #64798D;
    --gold: #4FC3F7;
    --gold-2: #2E86C1;
    --pos: #34D399;
    --neg: #F87171;

    --fisico:   #38BDF8;
    --finanzas: #2DD4BF;
    --estudios: #6C7FF2;
    --rutina:   #22C3A6;
    --social:   #A78BFA;
    --comida:   #7FB3E8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 90px; }

  /* header */
  .hero {
    position: relative;
    padding: 18px 18px 16px;
    background: linear-gradient(120deg, #0C1A2C 0%, #113052 55%, #163F68 100%);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; right: -30px; top: -60px;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(79,195,247,0.20), transparent 70%);
  }
  .hero h1 { margin: 0; font-size: 20px; font-weight: 800; color: #EAF6FF; letter-spacing: -0.01em; }
  .hero .sub { margin-top: 3px; font-size: 12px; color: var(--text-dim); font-weight: 600; }

  .toplevel-tabs {
    display: flex; gap: 6px; margin-top: 14px; position: relative; z-index: 1;
  }
  .toplevel-tabs button {
    flex: 1; padding: 8px 0; border-radius: 999px; border: 1px solid rgba(79,195,247,0.35);
    background: rgba(0,0,0,0.2); color: var(--text-dim); font-weight: 800; font-size: 10.5px;
    font-family: inherit; white-space: nowrap;
  }
  .toplevel-tabs button.active {
    background: linear-gradient(135deg,var(--gold),#2E86C1); color: #06121C; border-color: transparent;
  }

  /* day pills */
  .daypills {
    display: flex; gap: 6px; padding: 12px 14px 4px; overflow-x: auto;
  }
  .daypill {
    flex: 0 0 auto; min-width: 52px; padding: 7px 4px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line); text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .daypill .lbl { font-size: 8.5px; font-weight: 800; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.03em; }
  .daypill .num { font-size: 14px; font-weight: 800; color: var(--text-dim); }
  .daypill.active { border-color: var(--gold); background: rgba(79,195,247,0.12); }
  .daypill.active .num { color: var(--gold); }
  .daypill .ring { margin-top: 2px; }

  /* progress header */
  .progress-card {
    margin: 10px 14px 4px; padding: 14px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
  }
  .ring-wrap { position: relative; width: 52px; height: 52px; flex: none; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-wrap .pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: var(--gold);
  }
  .progress-text .t1 { font-size: 13px; font-weight: 800; color: var(--text); }
  .progress-text .t2 { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* checklist */
  .list { padding: 10px 14px 4px; display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--cat, var(--gold));
    border-radius: 12px; padding: 10px 12px;
  }
  .item .item-del { flex: none; align-self: center; margin-top: 0; }
  .item.done { opacity: 0.5; }
  .item .box {
    flex: none; width: 22px; height: 22px; border-radius: 7px;
    border: 2px solid var(--cat, var(--gold)); display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .item.done .box { background: var(--cat, var(--gold)); }
  .item .box svg { display: none; width: 13px; height: 13px; }
  .item.done .box svg { display: block; }
  .item .body { flex: 1; }
  .item .time { font-size: 10.5px; font-weight: 800; color: var(--cat, var(--gold)); }
  .item .name { font-size: 13.5px; font-weight: 650; margin-top: 1px; }
  .item.done .name { text-decoration: line-through; }

  .empty {
    margin: 40px 20px; text-align: center; color: var(--text-mute); font-size: 13px; line-height: 1.6;
  }
  .empty .big { font-size: 30px; margin-bottom: 8px; }

  .task-form-wrap { padding: 4px 14px 16px; }
  .reset-link {
    display: block; width: 100%; margin-top: 10px; background: none; border: none;
    color: var(--text-mute); font-size: 11px; font-family: inherit; text-decoration: underline;
    padding: 4px 0;
  }
  .task-form {
    margin-top: 8px; padding: 12px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .task-form .peso-form input[type="time"] { flex: 1; min-width: 0; }

  /* peso view */
  .peso-card {
    margin: 12px 14px; padding: 16px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .peso-form { display: flex; gap: 8px; min-width: 0; }
  .peso-form input {
    flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .peso-form input::placeholder { color: var(--text-mute); }
  .peso-form button {
    background: linear-gradient(135deg,var(--gold),#2E86C1); color: #06121C; border: none;
    border-radius: 10px; padding: 0 16px; font-weight: 800; font-size: 13px; font-family: inherit;
  }
  .peso-chart { margin-top: 16px; }
  .peso-entries { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .peso-entry {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; background: var(--surface-2); border-radius: 10px; font-size: 12.5px;
    gap: 8px;
  }
  .peso-entry .right { display: flex; align-items: center; gap: 8px; }
  .del-btn {
    flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--text-mute); font-size: 12px; line-height: 1; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
  }
  .del-btn:active { background: rgba(248,113,113,0.2); color: var(--fisico); border-color: var(--fisico); }
  .del-btn.confirming { background: var(--neg); color: white; border-color: var(--neg); }
  .reset-link.confirming { color: var(--neg); text-decoration: none; font-weight: 700; }

  .workout-entries { display: flex; flex-direction: column; gap: 8px; }
  .workout-entry {
    background: var(--surface-2); border-radius: 10px; padding: 10px 12px;
  }
  .workout-entry .wtop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .workout-entry .wdate { font-size: 11px; font-weight: 800; color: var(--gold); }
  .workout-entry .wtext { font-size: 12.5px; color: var(--text); white-space: pre-wrap; line-height: 1.5; }
  .peso-entry .d { color: var(--text-dim); }
  .peso-entry .v { font-weight: 800; }
  .peso-entry .delta { font-size: 10.5px; margin-left: 6px; }
  .delta.up { color: var(--rutina); }
  .delta.down { color: var(--fisico); }
  .peso-empty { color: var(--text-mute); font-size: 12.5px; text-align: center; padding: 20px 0; }

  .trading-note-input {
    width: 100%; margin-top: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; color: var(--text); font-size: 13px; font-family: inherit;
    -webkit-appearance: none; appearance: none;
  }
  .trading-note-input::placeholder { color: var(--text-mute); }
  .trading-stat {
    margin: 12px 14px 0; padding: 16px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line);
    text-align: center;
  }
  .trading-stat .big { font-size: 26px; font-weight: 800; }
  .trading-stat .big.pos { color: var(--rutina); }
  .trading-stat .big.neg { color: var(--fisico); }
  .trading-stat .lbl { font-size: 11px; color: var(--text-dim); margin-top: 3px; font-weight: 600; }
  .trading-entry-val { font-weight: 800; }
  .trading-entry-val.pos { color: var(--rutina); }
  .trading-entry-val.neg { color: var(--fisico); }
  .trading-entry-note { display: block; font-size: 10.5px; color: var(--text-mute); margin-top: 2px; }

  .stats-card {
    margin: 10px 14px 4px; padding: 14px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .stats-title { font-size: 12px; font-weight: 800; color: var(--gold); margin-bottom: 10px; }
  .range-toggle { display: flex; gap: 6px; margin-bottom: 12px; }
  .range-toggle button {
    flex: 1; padding: 7px 0; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text-dim); font-weight: 700; font-size: 11.5px; font-family: inherit;
  }
  .range-toggle button.active {
    background: linear-gradient(135deg,var(--gold),#2E86C1); color: #06121C; border-color: transparent;
  }
  .stats-inline {
    display: flex; gap: 10px; margin-top: 10px;
  }
  .stats-inline .box {
    flex: 1; background: var(--surface-2); border-radius: 10px; padding: 8px; text-align: center;
  }
  .stats-inline .box .v { font-size: 14px; font-weight: 800; }
  .stats-inline .box .v.pos { color: var(--rutina); }
  .stats-inline .box .v.neg { color: var(--fisico); }
  .stats-inline .box .l { font-size: 9.5px; color: var(--text-mute); margin-top: 2px; }

  .cat-badge {
    display: inline-block; font-size: 8.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px;
    margin-right: 6px; vertical-align: middle;
  }
  .cat-Saldo { background: rgba(127,179,232,0.18); color: var(--comida); }
  .cat-Taxi { background: rgba(79,195,247,0.18); color: var(--finanzas); }
  .cat-Inversión { background: rgba(52,211,153,0.18); color: var(--rutina); }
  .cat-Trading { background: rgba(167,139,250,0.2); color: var(--social); }
  .cat-Otro { background: rgba(100,121,141,0.2); color: var(--text-dim); }

  .cal-today { margin: 4px 0 12px; }
  .cal-today .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .cal-today .kcal { font-size: 18px; font-weight: 800; color: var(--gold); }
  .cal-today .goal { font-size: 11px; color: var(--text-mute); }
  .cal-bar-track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .cal-bar-fill { height: 100%; background: linear-gradient(90deg,var(--gold),#2E86C1); border-radius: 999px; }
  .cal-bar-fill.over { background: linear-gradient(90deg,var(--fisico),#F87171); }
  .cal-remaining { margin-top: 8px; font-size: 12px; color: var(--text-dim); }
  .cal-remaining strong { color: var(--gold); font-weight: 800; }
  .cal-remaining.done strong { color: var(--pos); }

  .foot-msg {
    text-align: center; font-size: 11px; color: var(--text-mute); padding: 18px 20px 4px;
  }

  .summary-btn-wrap { padding: 4px 14px 0; }
  .summary-btn {
    width: 100%; padding: 12px 0; border-radius: 12px; border: 1px solid rgba(79,195,247,0.4);
    background: rgba(79,195,247,0.1); color: var(--gold); font-weight: 800; font-size: 13px;
    font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .summary-btn.copied { background: rgba(52,211,153,0.15); border-color: rgba(52,211,153,0.5); color: var(--rutina); }

  .summary-modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 10;
    align-items: flex-end; justify-content: center;
  }
  .summary-modal-backdrop.open { display: flex; }
  .summary-modal {
    width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px 18px 0 0; padding: 16px 16px 22px; max-height: 75vh; display: flex; flex-direction: column;
  }
  .summary-modal h3 { margin: 0 0 10px; font-size: 14px; color: var(--gold); }
  .summary-modal textarea {
    flex: 1; min-height: 220px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); font-size: 12px; font-family: -apple-system, monospace; padding: 10px; line-height: 1.5;
  }
  .summary-modal .actions { display: flex; gap: 8px; margin-top: 10px; }
  .summary-modal .actions button {
    flex: 1; padding: 11px 0; border-radius: 10px; border: none; font-weight: 800; font-size: 13px; font-family: inherit;
  }
  .summary-modal .btn-copy { background: linear-gradient(135deg,var(--gold),#2E86C1); color: #06121C; }
  .summary-modal .btn-close { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--line); }
</style>
</head>
<body>
<div id="app">
  <div class="hero">
    <h1>WINTER ARC</h1>
    <div class="badge">❄️ Semana 2 — no pares</div>
    <div class="toplevel-tabs">
      <button id="tabRutina" class="active">✅ Routine</button>
      <button id="tabPeso">💪 Physical</button>
      <button id="tabMoney">💰 Money</button>
    </div>
  </div>

  <div id="rutinaView">
    <div class="daypills" id="daypills"></div>
    <div class="progress-card" id="progressCard"></div>
    <div class="stats-card" id="rutinaStatsCard">
      <div class="stats-title">📊 Estadísticas de la semana</div>
      <div id="rutinaStatsChart"></div>
    </div>
    <div class="list" id="list"></div>
    <div class="task-form-wrap" id="taskFormWrap"></div>
  </div>

  <div id="pesoView" style="display:none;">
    <div class="peso-card">
      <div class="stats-title">🍽️ Calorías (objetivo 4500 kcal/día)</div>
      <div class="cal-today" id="calToday"></div>
      <div class="range-toggle" id="calRangeToggle">
        <button data-range="week" class="active">Semana</button>
        <button data-range="month">Mes</button>
      </div>
      <div class="peso-chart"><svg id="calSvg" width="100%" height="100" viewBox="0 0 300 100" preserveAspectRatio="none"></svg></div>
      <div class="peso-form" style="margin-top:12px;">
        <input type="date" id="calDate" />
        <input type="number" step="1" inputmode="numeric" id="calValue" placeholder="kcal" />
      </div>
      <input type="text" id="calNote" placeholder="Nota (opcional): comida, cena..." class="trading-note-input" />
      <button id="calAdd" class="summary-btn" style="margin-top:8px;">Añadir kcal</button>
      <div class="peso-entries" id="calEntries" style="margin-top:14px;"></div>
    </div>

    <div class="peso-card" style="margin-top:12px;">
      <div class="range-toggle" id="pesoRangeToggle">
        <button data-range="week" class="active">Semana</button>
        <button data-range="month">Mes</button>
      </div>
      <div class="peso-form">
        <input type="date" id="pesoDate" />
        <input type="number" step="0.1" inputmode="decimal" id="pesoValue" placeholder="kg" />
        <button id="pesoAdd">Añadir</button>
      </div>
      <div class="peso-chart"><svg id="pesoSvg" width="100%" height="90" viewBox="0 0 300 90" preserveAspectRatio="none"></svg></div>
      <div class="stats-inline" id="pesoStatsInline"></div>
      <div class="peso-entries" id="pesoEntries"></div>
    </div>

    <div class="peso-card" style="margin-top:12px;">
      <div class="stats-title">🏋️ Entrenamientos</div>
      <input type="date" id="workoutDate" style="width:100%; margin-bottom:8px;" class="trading-note-input" />
      <textarea id="workoutText" placeholder="Pega aquí tu entreno (igual que lo apuntas en Notas)..." class="trading-note-input" style="min-height:110px; resize:vertical; font-family:inherit;"></textarea>
      <button id="workoutAdd" class="summary-btn" style="margin-top:8px;">Guardar entrenamiento</button>
      <div class="workout-entries" id="workoutEntries" style="margin-top:14px;"></div>
    </div>
  </div>

  <div id="moneyView" style="display:none;">
  <div id="tradingView">
    <div class="trading-stat" id="tradingStat"></div>
    <div class="peso-card">
      <div class="range-toggle" id="tradingRangeToggle">
        <button data-range="week" class="active">Semana</button>
        <button data-range="month">Mes</button>
      </div>
      <div class="peso-chart"><svg id="tradingSvg" width="100%" height="100" viewBox="0 0 300 100" preserveAspectRatio="none"></svg></div>
      <div class="peso-form" style="margin-top:12px;">
        <input type="date" id="tradingDate" />
        <input type="number" step="0.1" inputmode="decimal" id="tradingValue" placeholder="% (ej. 1 o -0.5)" />
      </div>
      <input type="text" id="tradingNote" placeholder="Nota (opcional): sesión, cuenta..." class="trading-note-input" />
      <button id="tradingAdd" class="summary-btn" style="margin-top:8px;">Añadir resultado</button>
      <div class="peso-entries" id="tradingEntries" style="margin-top:14px;"></div>
    </div>
  </div>

  <div id="ahorrosView" style="margin-top:14px;">
    <div class="trading-stat" id="ahorrosBalance"></div>
    <div class="peso-card">
      <div class="range-toggle" id="ahorrosRangeToggle">
        <button data-range="week" class="active">Semana</button>
        <button data-range="month">Mes</button>
      </div>
      <div class="peso-chart"><svg id="ahorrosSvg" width="100%" height="100" viewBox="0 0 300 100" preserveAspectRatio="none"></svg></div>
      <div class="stats-inline" id="ahorrosStatsInline"></div>
      <div class="peso-form" style="margin-top:12px;">
        <input type="date" id="ahorrosDate" />
        <input type="number" step="0.01" inputmode="decimal" id="ahorrosValue" placeholder="€ (ej. 150 o -30)" />
      </div>
      <select id="ahorrosCategory" class="trading-note-input">
        <option value="Saldo inicial">Saldo inicial</option>
        <option value="Taxi">Taxi</option>
        <option value="Inversión">Inversión</option>
        <option value="Trading">Trading (retiro/aporte)</option>
        <option value="Otro">Otro</option>
      </select>
      <input type="text" id="ahorrosNote" placeholder="Nota (opcional)" class="trading-note-input" style="margin-top:8px;" />
      <button id="ahorrosAdd" class="summary-btn" style="margin-top:8px;">Añadir movimiento</button>
      <div class="peso-entries" id="ahorrosEntries" style="margin-top:14px;"></div>
    </div>
  </div>
  </div>

  <div class="summary-btn-wrap">
    <button class="summary-btn" id="summaryBtn">📋 Generar resumen para Claude</button>
  </div>

  <div class="foot-msg">The Arc doesn't stop. Winter built different. ❄️</div>
</div>

<div class="summary-modal-backdrop" id="summaryBackdrop">
  <div class="summary-modal">
    <h3>Resumen para pegar en el chat</h3>
    <textarea id="summaryText" readonly></textarea>
    <div class="actions">
      <button class="btn-close" id="summaryClose">Cerrar</button>
      <button class="btn-copy" id="summaryCopy">Copiar</button>
    </div>
  </div>
</div>

<script>
const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="#06121C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

const days = [
  { key: 'lun', date: '2026-08-31', label: 'LUN', num: 31 },
  { key: 'mar', date: '2026-09-01', label: 'MAR', num: 1 },
  { key: 'mie', date: '2026-09-02', label: 'MIÉ', num: 2 },
  { key: 'jue', date: '2026-09-03', label: 'JUE', num: 3 },
  { key: 'vie', date: '2026-09-04', label: 'VIE', num: 4 },
  { key: 'sab', date: '2026-09-05', label: 'SÁB', num: 5 },
  { key: 'dom', date: '2026-09-06', label: 'DOM', num: 6 },
];

const DEFAULT_ITEMS = {
  lun: [
    ['08:00','08:20','fisico','Despertar · agua en la cara + terraza (luz solar)'],
    ['08:20','08:55','comida','Desayuno'],
    ['08:55','10:00','finanzas','Sesión de Londres + journaling'],
    ['10:00','11:15','fisico','Gym: Pecho / Tríceps'],
    ['14:45','15:10','comida','Comida (rápida)'],
    ['15:10','15:15','finanzas','Análisis previo a la sesión'],
    ['15:15','16:30','finanzas','Sesión de NY'],
    ['16:30','16:45','finanzas','Journaling NY'],
    ['16:45','17:45','rutina','Siesta'],
    ['17:45','18:30','comida','Merienda: batido de proteína'],
    ['19:00','20:30','fisico','Fútbol (provisional — confirmar día)'],
    ['20:30','21:30','comida','Cena'],
    ['23:45','00:00','rutina','Lectura 10 min + creatina'],
    ['00:00','00:15','rutina','Antes de dormir'],
  ],
  mar: [
    ['08:00','08:20','fisico','Despertar · agua en la cara + terraza (luz solar)'],

let activeDay = 'sab';
let checkedCache = {};
let itemsCache = {};

async function getItems(dayKey) {
  if (itemsCache[dayKey]) return itemsCache[dayKey];
  const raw = await storeGet(`routine:items:${dayKey}`);
  if (raw) {
    itemsCache[dayKey] = JSON.parse(raw);
  } else {
    const seed = (DEFAULT_ITEMS[dayKey] || []).map(([start,end,cat,name]) => ({ id: newId(), start, end, cat, name }));
    itemsCache[dayKey] = seed;
    await storeSet(`routine:items:${dayKey}`, JSON.stringify(seed));
  }
  return itemsCache[dayKey];
}
async function saveItems(dayKey, list) {
  itemsCache[dayKey] = list;
  await storeSet(`routine:items:${dayKey}`, JSON.stringify(list));
}

/* Storage layer: uses window.storage when available (viewed inside Claude),
   falls back to the browser's own localStorage when opened as a standalone
   file (e.g. downloaded and opened on mobile) — which is the normal case
   for this file. */
const hasClaudeStorage = typeof window.storage !== 'undefined';

async function storeGet(key) {
  if (hasClaudeStorage) {
    try {
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    } catch (e) { return null; }
  }
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
async function storeSet(key, value) {
  if (hasClaudeStorage) {
    try { await window.storage.set(key, value, false); return; } catch (e) { /* fall through */ }
  }
  try { localStorage.setItem(key, value); } catch (e) { console.error('storage failed', e); }
}

async function loadChecks(dayKey) {
  if (checkedCache[dayKey]) return checkedCache[dayKey];
  const raw = await storeGet(`checklist:${dayKey}`);
  checkedCache[dayKey] = raw ? JSON.parse(raw) : {};
  return checkedCache[dayKey];
}

async function saveChecks(dayKey) {
  await storeSet(`checklist:${dayKey}`, JSON.stringify(checkedCache[dayKey] || {}));
}

function ringSVG(pct, size, stroke, color) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - pct);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#29394A" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

async function renderDaypills() {
  const el = document.getElementById('daypills');
  let html = '';
  for (const d of days) {
    const checks = await loadChecks(d.key);
    const dItems = await getItems(d.key);
    const total = dItems.length;
    const done = dItems.filter(it => checks[it.id]).length;
    const pct = total ? done / total : 0;
    html += `<div class="daypill ${d.key === activeDay ? 'active' : ''}" data-day="${d.key}">
      <div class="lbl">${d.label}</div>
      <div class="num">${d.num}</div>
      ${total ? `<div class="ring">${ringSVG(pct, 20, 3, d.key === activeDay ? '#4FC3F7' : '#64798D')}</div>` : ''}
    </div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.daypill').forEach(p => {
    p.addEventListener('click', () => { activeDay = p.dataset.day; renderAll(); });
  });
}

async function renderProgressAndList() {
  const day = days.find(d => d.key === activeDay);
  const progressCard = document.getElementById('progressCard');
  const list = document.getElementById('list');
  const dayItems = await getItems(day.key);

  if (!dayItems.length) {
    progressCard.style.display = 'none';
    list.innerHTML = `<div class="empty"><div class="big">🗓️</div>Aún no hay tareas en este día.<br>Usa "Añadir tarea" abajo, o restaura la rutina por defecto si debería tener una.</div>`;
    renderTaskForm();
    return;
  }
  progressCard.style.display = 'flex';

  const checks = await loadChecks(day.key);
  const done = dayItems.filter(it => checks[it.id]).length;
  const pct = dayItems.length ? done / dayItems.length : 0;

  const monthNames = {'01':'enero','02':'febrero','03':'marzo','04':'abril','05':'mayo','06':'junio','07':'julio','08':'agosto','09':'septiembre','10':'octubre','11':'noviembre','12':'diciembre'};
  const [, dMM] = day.date.split('-');
  progressCard.innerHTML = `
    <div class="ring-wrap">
      ${ringSVG(pct, 52, 5, '#4FC3F7')}
      <div class="pct">${Math.round(pct*100)}%</div>
    </div>
    <div class="progress-text">
      <div class="t1">${done} de ${dayItems.length} completado${done===1?'':'s'}</div>
      <div class="t2">${day.label} ${day.num} de ${monthNames[dMM]}</div>
    </div>`;

  list.innerHTML = dayItems.map(it => {
    const isDone = !!checks[it.id];
    return `<div class="item ${isDone ? 'done' : ''} c-${it.cat}" data-id="${it.id}" style="--cat:var(--${it.cat})">
      <div class="box check-tap">${CHECK_ICON}</div>
      <div class="body check-tap">
        <div class="time">${it.start}–${it.end}</div>
        <div class="name">${it.name}</div>
      </div>
      <button class="del-btn item-del" data-id="${it.id}">✕</button>
    </div>`;
  }).join('');

  list.querySelectorAll('.check-tap').forEach(el => {
    el.addEventListener('click', async () => {
      const id = el.closest('.item').dataset.id;
      const c = await loadChecks(activeDay);
      c[id] = !c[id];
      checkedCache[activeDay] = c;
      await saveChecks(activeDay);
      renderAll();
    });
  });
  list.querySelectorAll('.item-del').forEach(btn => {
    armDoubleTap(btn, '', async () => {
      const id = btn.dataset.id;
      const cur = await getItems(activeDay);
      await saveItems(activeDay, cur.filter(it => it.id !== id));
      const c = await loadChecks(activeDay);
      delete c[id];
      checkedCache[activeDay] = c;
      await saveChecks(activeDay);
      renderAll();
    }, true);
  });

  renderTaskForm();
}

async function renderRutinaStats() {
  const el = document.getElementById('rutinaStatsChart');
  const w = 300, h = 100, barW = 28, gap = 10.5;
  let x = 6;
  let bars = '';
  for (const d of days) {
    const checks = await loadChecks(d.key);
    const dItems = await getItems(d.key);
    const total = dItems.length;
    const hasData = total > 0;
    let pct = 0;
    if (hasData) {
      const done = dItems.filter(it => checks[it.id]).length;
      pct = done / total;
    }
    const barH = hasData ? Math.max(pct * 62, 3) : 4;
    const y = h - 20 - barH;
    const color = d.key === activeDay ? '#4FC3F7' : (hasData ? '#6C7FF2' : '#29394A');
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="5" fill="${color}"/>`;
    bars += `<text x="${x + barW/2}" y="${h - 6}" font-size="9" fill="#64798D" text-anchor="middle" font-weight="700">${d.label}</text>`;
    x += barW + gap;
  }
  el.innerHTML = `<svg viewBox="0 0 ${x} ${h}" width="100%" height="110">${bars}</svg>`;
}

let pesoRange = 'week';

async function loadPeso() {
  const raw = await storeGet('peso:entries');
  return raw ? JSON.parse(raw) : [];
}
async function savePeso(entries) {
  await storeSet('peso:entries', JSON.stringify(entries));
}

function filterByRange(entries, range) {
  const days = range === 'month' ? 30 : 7;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  return entries.filter(e => e.date >= cutoffStr);
}

function drawSparkline(entries) {
  const svg = document.getElementById('pesoSvg');
  if (entries.length < 2) { svg.innerHTML = entries.length ? `<text x="150" y="45" font-size="11" fill="#64798D" text-anchor="middle">Añade otro registro para ver la tendencia</text>` : ''; return; }
  const sorted = [...entries].sort((a,b) => a.date.localeCompare(b.date));
  const vals = sorted.map(e => e.kg);
  const min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max - min) < 1 ? 1 : (max - min) * 0.15;
  const lo = min - pad, hi = max + pad;
  const w = 300, h = 90, m = 8;
  const pts = sorted.map((e,i) => {
    const x = m + (i/(sorted.length-1)) * (w - 2*m);
    const y = h - m - ((e.kg - lo)/(hi-lo)) * (h - 2*m);
    return `${x},${y}`;
  });
  const line = pts.join(' ');
  svg.innerHTML = `
    <polyline points="${line}" fill="none" stroke="#4FC3F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="#4FC3F7"/>`).join('')}
  `;
}

async function renderPeso() {
  const all = await loadPeso();
  const entries = filterByRange(all, pesoRange);
  const sorted = [...entries].sort((a,b) => b.date.localeCompare(a.date));
  const el = document.getElementById('pesoEntries');
  const statsEl = document.getElementById('pesoStatsInline');

  if (!sorted.length) {
    el.innerHTML = `<div class="peso-empty">Sin registros en este rango.</div>`;
    statsEl.innerHTML = '';
  } else {
    el.innerHTML = sorted.map((e, i) => {
      const prev = sorted[i+1];
      let deltaHtml = '';
      if (prev) {
        const d = (e.kg - prev.kg);
        const sign = d > 0 ? '+' : '';
        deltaHtml = `<span class="delta ${d >= 0 ? 'up' : 'down'}">${sign}${d.toFixed(1)} kg</span>`;
      }
      const dt = new Date(e.date + 'T00:00:00');
      const dstr = dt.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
      return `<div class="peso-entry"><span class="d">${dstr}</span><span class="right"><span class="v">${e.kg} kg</span>${deltaHtml}<button class="del-btn" data-kind="peso" data-id="${e.id}">✕</button></span></div>`;
    }).join('');

    const chrono = [...entries].sort((a,b) => a.date.localeCompare(b.date));
    const change = chrono.length > 1 ? (chrono[chrono.length-1].kg - chrono[0].kg) : 0;
    const avg = (entries.reduce((s,e) => s + e.kg, 0) / entries.length);
    statsEl.innerHTML = `
      <div class="box"><div class="v ${change >= 0 ? 'pos' : 'neg'}">${change >= 0 ? '+' : ''}${change.toFixed(1)} kg</div><div class="l">cambio en el rango</div></div>
      <div class="box"><div class="v">${avg.toFixed(1)} kg</div><div class="l">promedio</div></div>`;
  }
  drawSparkline(entries);
}

  pesoRange = btn.dataset.range;

/* ---------- CALORÍAS ---------- */
const CAL_GOAL = 4500;
let calRange = 'week';

async function loadCal() {
  const raw = await storeGet('calorias:entries');
  return raw ? JSON.parse(raw) : [];
}
async function saveCal(entries) {
  await storeSet('calorias:entries', JSON.stringify(entries));
}

function groupByDate(entries) {
  const map = {};
  entries.forEach(e => { map[e.date] = (map[e.date] || 0) + e.kcal; });
  return map;
}

function drawCalBars(entries) {
  const svg = document.getElementById('calSvg');
  const byDate = groupByDate(entries);
  const dates = Object.keys(byDate).sort();
  if (!dates.length) { svg.innerHTML = `<text x="150" y="50" font-size="11" fill="#64798D" text-anchor="middle">Sin registros en este rango</text>`; return; }
  const w = 300, h = 100, m = 10;
  const maxVal = Math.max(...dates.map(d => byDate[d]), CAL_GOAL) * 1.05;
  const step = (w - 2*m) / dates.length;
  const barW = Math.min(24, step - 6);
  const goalY = h - m - (CAL_GOAL / maxVal) * (h - 2*m);
  let bars = '';
  dates.forEach((d, i) => {
    const val = byDate[d];
    const x = m + i * step + (step - barW)/2;
    const barH = (val / maxVal) * (h - 2*m);
    const y = h - m - barH;
    const color = val >= CAL_GOAL ? '#34D399' : '#4FC3F7';
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(barH,2)}" rx="3" fill="${color}"/>`;
  });
  bars += `<line x1="${m}" y1="${goalY}" x2="${w-m}" y2="${goalY}" stroke="#2E86C1" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  svg.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100">${bars}</svg>`;
}

async function renderCal() {
  const all = await loadCal();
  const todayStr = new Date().toISOString().slice(0,10);
  const todayTotal = all.filter(e => e.date === todayStr).reduce((s,e) => s + e.kcal, 0);
  const pct = Math.min(todayTotal / CAL_GOAL, 1);
  const over = todayTotal > CAL_GOAL;
  const remaining = CAL_GOAL - todayTotal;
  document.getElementById('calToday').innerHTML = `
    <div class="row"><span class="kcal">${todayTotal} kcal hoy</span><span class="goal">objetivo ${CAL_GOAL}</span></div>
    <div class="cal-bar-track"><div class="cal-bar-fill ${over ? 'over' : ''}" style="width:${pct*100}%"></div></div>
    <div class="cal-remaining ${remaining <= 0 ? 'done' : ''}">${remaining > 0 ? `Te quedan <strong>${remaining} kcal</strong> hoy` : `Objetivo cumplido — <strong>+${Math.abs(remaining)} kcal</strong> de más`}</div>`;

  const entries = filterByRange(all, calRange);
  drawCalBars(entries);

  // La lista de abajo solo muestra las comidas de HOY, para no alargar la página
  const todayEntries = all.filter(e => e.date === todayStr).sort((a,b) => b.id.localeCompare(a.id));
  const el = document.getElementById('calEntries');
  if (!todayEntries.length) {
    el.innerHTML = `<div class="peso-empty">Aún no has añadido comidas hoy.</div>`;
  } else {
    el.innerHTML = todayEntries.map(e => {
      return `<div class="peso-entry">
        <span class="d">${e.note || 'Comida'}</span>
        <span class="right"><span class="v">${e.kcal} kcal</span><button class="del-btn" data-kind="cal" data-id="${e.id}">✕</button></span>
      </div>`;
    }).join('');
  }
}

/* Confirmación de dos toques (no depende del confirm() nativo, que en apps
   añadidas a la pantalla de inicio de iOS a veces no funciona bien).
   Si iconOnly es true, no cambia el texto (para botones circulares pequeños),
   solo aplica la clase .confirming para dar feedback visual. */
function armDoubleTap(btn, confirmText, action, iconOnly) {
  let timer = null;
  const original = btn.innerHTML;
  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (btn.dataset.armed === '1') {
      clearTimeout(timer);
      btn.dataset.armed = '0';
      if (!iconOnly) btn.innerHTML = original;
      btn.classList.remove('confirming');
      await action();
    } else {
      btn.dataset.armed = '1';
      if (!iconOnly) btn.innerHTML = confirmText;
      btn.classList.add('confirming');
      timer = setTimeout(() => {
        btn.dataset.armed = '0';
        if (!iconOnly) btn.innerHTML = original;
        btn.classList.remove('confirming');
      }, 3000);
    }
  });
}

async function loadTrading() {

function drawTradingBars(entries) {
  const svg = document.getElementById('tradingSvg');
  if (!entries.length) { svg.innerHTML = `<text x="150" y="50" font-size="11" fill="#64798D" text-anchor="middle">Sin registros en este rango</text>`; return; }
  const sorted = [...entries].sort((a,b) => a.date.localeCompare(b.date));
  const w = 300, h = 100, m = 10;
  const maxAbs = Math.max(...sorted.map(e => Math.abs(e.pct)), 1);
  const zero = h / 2;
  const barW = Math.min(24, (w - 2*m) / sorted.length - 6);
  const step = (w - 2*m) / sorted.length;
  let bars = '';
  sorted.forEach((e, i) => {
    const x = m + i * step + (step - barW)/2;
    const barH = (Math.abs(e.pct) / maxAbs) * (h/2 - 12);
    const y = e.pct >= 0 ? zero - barH : zero;
    const color = e.pct >= 0 ? '#34D399' : '#F87171';
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(barH,2)}" rx="3" fill="${color}"/>`;
  });
  bars += `<line x1="${m}" y1="${zero}" x2="${w-m}" y2="${zero}" stroke="#29394A" stroke-width="1"/>`;
  svg.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100">${bars}</svg>`;
}

async function renderTrading() {
  const all = await loadTrading();
  const entries = filterByRange(all, tradingRange);
  const sorted = [...entries].sort((a,b) => b.date.localeCompare(a.date));
  const statEl = document.getElementById('tradingStat');
  const total = entries.reduce((s,e) => s + e.pct, 0);
  const sign = total >= 0 ? '+' : '';
  statEl.innerHTML = `
    <div class="big ${total >= 0 ? 'pos' : 'neg'}">${sign}${total.toFixed(2)}%</div>
    <div class="lbl">Resultado acumulado (${tradingRange === 'week' ? 'esta semana' : 'este mes'}, ${entries.length} registro${entries.length===1?'':'s'})</div>`;

  drawTradingBars(entries);

  const el = document.getElementById('tradingEntries');
  if (!sorted.length) {
    el.innerHTML = `<div class="peso-empty">Sin registros en este rango.</div>`;
  } else {
    el.innerHTML = sorted.map(e => {
      const s = e.pct >= 0 ? '+' : '';
      const dt = new Date(e.date + 'T00:00:00');
      const dstr = dt.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
      return `<div class="peso-entry">
        <span class="d">${dstr}${e.note ? `<span class="trading-entry-note">${e.note}</span>` : ''}</span>
        <span class="right"><span class="trading-entry-val ${e.pct >= 0 ? 'pos' : 'neg'}">${s}${e.pct}%</span><button class="del-btn" data-kind="trading" data-id="${e.id}">✕</button></span>
      </div>`;
    }).join('');
  }
}

document.getElementById('app').addEventListener('click', async (e) => {
  const btn = e.target.closest('.del-btn');
  if (!btn) return;

  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1';
    btn.classList.add('confirming');
    clearTimeout(btn._resetTimer);
    btn._resetTimer = setTimeout(() => {
      btn.dataset.armed = '0';
      btn.classList.remove('confirming');
    }, 3000);
    return;
  }
  clearTimeout(btn._resetTimer);
  btn.dataset.armed = '0';
  btn.classList.remove('confirming');

  const id = btn.dataset.id;
  const kind = btn.dataset.kind;

  if (kind === 'peso') {
    const entries = await loadPeso();
    await savePeso(entries.filter(x => x.id !== id));
    renderPeso();
  } else if (kind === 'trading') {
    const entries = await loadTrading();
    await saveTrading(entries.filter(x => x.id !== id));
    renderTrading();
  } else if (kind === 'ahorros') {
    const entries = await loadAhorros();
    await saveAhorros(entries.filter(x => x.id !== id));
    renderAhorros();
  } else if (kind === 'cal') {
    const entries = await loadCal();
    await saveCal(entries.filter(x => x.id !== id));
    renderCal();
  } else if (kind === 'workout') {
    const entries = await loadWorkouts();
    await saveWorkouts(entries.filter(x => x.id !== id));
    renderWorkouts();
  }
});

/* ---------- RESUMEN PARA CLAUDE ---------- */
async function buildSummary() {
  const lines = [];
  lines.push(`Resumen de mi semana (${new Date().toLocaleDateString('es-ES')}):`);
  lines.push('');
  for (const d of days) {
    const dayItems = await getItems(d.key);
    if (!dayItems.length) continue;
    const checks = await loadChecks(d.key);
    const done = dayItems.filter(it => checks[it.id]).length;
    const [, mm, dd] = d.date.split('-');
    lines.push(`${d.label} ${dd}/${mm} — ${done}/${dayItems.length} completado:`);
    dayItems.forEach(it => {
      lines.push(`  ${checks[it.id] ? '[x]' : '[ ]'} ${it.start}–${it.end} ${it.name}`);
    });
    lines.push('');
  }
  const peso = await loadPeso();
  const sorted = [...peso].sort((a,b) => a.date.localeCompare(b.date));
  lines.push('Peso registrado:');
  if (!sorted.length) {
    lines.push('  (sin registros aún)');
  } else {
    sorted.forEach(e => lines.push(`  ${e.date}: ${e.kg} kg`));
  }
  lines.push('');

  const cal = await loadCal();
  const calByDate = groupByDate(cal);
  const calDates = Object.keys(calByDate).sort();
  lines.push(`Calorías (objetivo ${CAL_GOAL} kcal/día):`);
  if (!calDates.length) {
    lines.push('  (sin registros aún)');
  } else {
    calDates.forEach(d => lines.push(`  ${d}: ${calByDate[d]} kcal (${calByDate[d] >= CAL_GOAL ? 'cumplido' : 'por debajo'})`));
  }
  lines.push('');

  const trading = await loadTrading();
  const tsorted = [...trading].sort((a,b) => a.date.localeCompare(b.date));
  const total = trading.reduce((s,e) => s + e.pct, 0);
  lines.push(`Trading (acumulado ${total >= 0 ? '+' : ''}${total.toFixed(2)}%):`);
  if (!tsorted.length) {
    lines.push('  (sin registros aún)');
  } else {
    tsorted.forEach(e => lines.push(`  ${e.date}: ${e.pct >= 0 ? '+' : ''}${e.pct}%${e.note ? ' — ' + e.note : ''}`));
  }
  lines.push('');

  const ahorros = await loadAhorros();
  const asorted = [...ahorros].sort((a,b) => a.date.localeCompare(b.date));
  const balance = ahorros.reduce((s,e) => s + e.amount, 0);
  lines.push(`Ahorros (total actual: ${balance.toFixed(2)}€):`);
  if (!asorted.length) {
    lines.push('  (sin movimientos aún)');
  } else {
    asorted.forEach(e => lines.push(`  ${e.date}: ${e.amount >= 0 ? '+' : ''}${e.amount.toFixed(2)}€ [${e.category}]${e.note ? ' — ' + e.note : ''}`));
  }
  lines.push('');

  const workouts = await loadWorkouts();
  const wsorted = [...workouts].sort((a,b) => a.date.localeCompare(b.date));
  lines.push('Entrenamientos:');
  if (!wsorted.length) {
    lines.push('  (sin registros aún)');
  } else {
    wsorted.forEach(w => {
      lines.push(`  ${w.date}:`);
      w.text.split('\n').forEach(line => lines.push(`    ${line}`));
    });
  }
  return lines.join('\n');
}
